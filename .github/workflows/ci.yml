name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Ruff
        run: ruff check app scripts tests --select E9,F --ignore E402
      - name: Compile
        run: python -m compileall -q app scripts tests
      - name: Tests
        run: pytest -q
